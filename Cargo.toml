[package]
authors = [ "qaptoR <git@arxdaingneachd.org>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "A parser for the configurable Fey markup language"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "fey" ]
license = "MIT"
name = "tree-sitter-fey"
readme = "README.md"
repository = "https://github.com/Loreite/tree-sitter-fey"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
